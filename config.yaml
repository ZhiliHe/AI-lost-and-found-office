# AI Lost & Found - project config
# Change `vlm.model` to swap models. Nothing else in the code hardcodes a model.

vlm:
  # backend: mlx | transformers | cuda | dummy
  #   mlx          -> Apple Silicon, via mlx-vlm  (recommended on Mac)
  #   transformers -> CPU or auto-detected CUDA, via HuggingFace transformers
  #   cuda         -> NVIDIA GPU, explicitly accelerated: forced CUDA device,
  #                   half precision, Flash Attention (sdpa fallback), optional
  #                   torch.compile, batched indexing (fastest on an NVIDIA box)
  #   dummy        -> no model needed, returns canned output (for development)
  #
  # THESE TWO LINES ARE PER-MACHINE. They are the one part of this file that
  # legitimately differs between us, so they conflict on every merge. Change
  # them locally to whatever your machine has; do not "fix" someone else's.
  # Only the person who INDEXES needs them right - everyone else works from the
  # committed data/scene_index.json and needs no model at all.
  #
  # On Apple Silicon:
  #   pip install -U mlx-vlm
  backend: mlx
  model: models/Qwen3-VL-2B-Instruct-4bit
  #
  # On an NVIDIA machine:
  #   pip install torch --index-url https://download.pytorch.org/whl/cu128
  # backend: cuda
  # model: Qwen/Qwen2-VL-2B-Instruct   # 3B fp16 does NOT fit in 8GB VRAM

  # Set true on networks that cannot reach huggingface.co: loads ONLY from the
  # local cache and never does the online HEAD check (which hangs forever on a
  # blocked network). Requires the model to already be cached.
  hf_offline: true
  # Each object costs ~120 tokens, so 15 objects needs ~1800. 3072 is ample for
  # any real desk.
  #
  # Do NOT raise this to "be safe". A 2B model that starts repeating itself will
  # happily fill whatever budget you give it, and generation time scales with
  # the budget - 8192 took minutes per image on an 8GB Mac. Capping low bounds
  # the damage, and the parser salvages every complete object from whatever was
  # produced before the cut.
  max_tokens: 3072
  temperature: 0.0

  # IMPORTANT: never feed full-resolution phone photos to the VLM.
  # 4032px images explode into tens of thousands of vision tokens and will
  # stall an 8GB machine. But 1024 turned out to be too aggressive: on a
  # 4032x3024 desk photo, chargers and cables shrank to ~40px and the model
  # missed them. 1280 is the compromise. Raise it if small objects are still
  # being missed, and watch memory.
  max_image_side: 1280

  # Tiling: 0 = off, 2 = run a 2x2 grid of overlapping crops in ADDITION to
  # the full photo, 3 = a 3x3 grid.
  #
  # Why: max_image_side shrinks a 4032px photo to 1280, which turns a USB stick
  # into 38 pixels - and a 2B model does not see 38 pixels. A tile is cropped
  # from the ORIGINAL image, so the same object arrives several times larger.
  # On our office desk the full pass alone found 8 of ~18 objects, and every
  # miss was small or near an edge.
  #
  # Cost: 1 pass becomes 5 (or 10 for a 3x3), so ~4 minutes per photo instead
  # of ~45 seconds. Leave it off while iterating; turn it on for the final
  # index. See src/tiling.py for how overlap stops objects being cut in half.
  tiling: 2

  # How the model reports bounding boxes.
  #   norm1000     -> coordinates normalised to 0..1000 (we ASK for this in the prompt)
  #   abs_resized  -> absolute pixels in the *resized* image the model actually saw
  # If your boxes land in the wrong place, this is the first thing to change.
  # Verify with:  python -m src.visualize --scene office_01
  coord_mode: norm1000

  # --- CUDA acceleration (used by backend: cuda; ignored elsewhere) ---------
  #
  # Which device to run on.
  #   auto -> the CUDA backend forces the first GPU (cuda:0); the transformers
  #           backend lets torch/accelerate decide (device_map="auto")
  #   cuda | cuda:0 | cuda:1 -> force a specific GPU
  #   cpu  -> force the CPU
  device: auto

  # Inference precision. The cuda backend treats "auto" as float16, which is
  # ~2x faster than fp32 and the safe default. bfloat16 is gentler on Ampere+
  # (RTX 30xx/40xx/50xx) for larger models.
  #   auto | float16 | bfloat16 | float32
  dtype: auto

  # Attention implementation. flash_attention_2 needs the flash-attn package;
  # if it is missing or unsupported the cuda backend falls back to sdpa
  # automatically, so leaving this on the default is always safe.
  #   auto | flash_attention_2 | sdpa | eager
  attn_implementation: auto

  # torch.compile the model. The FIRST generation pays a one-off compile cost
  # (minutes) and later ones run faster. Off by default because it is flaky on
  # some Windows + CUDA setups.
  compile: false

  # Images per GPU generation call in src/indexer.py. Generation is GPU-bound,
  # so 2-4 images in one call are barely slower than 1 image - this is the
  # biggest CUDA speedup for indexing. 4 fits on 8 GB VRAM with a 2B model;
  # if the indexer prints "(batch of N failed ... retrying one by one)" or an
  # OOM, drop back to 2. Only used when backend is cuda.
  batch_size: 2

paths:
  images: data/images
  index: data/scene_index.json
  ground_truth: data/ground_truth.json
  debug: data/debug

agent:
  # How many clarification questions before we give up and show the shortlist.
  max_clarify_turns: 3
  # How many scenes the retrieval stage passes on to the candidate stage.
  top_k_scenes: 5

  # Query-time VLM verification (src/verify.py).
  #
  # OFF by default. The index is built once offline, so a query normally costs
  # ~10ms of dictionary lookups. Turning this on makes the agent crop each
  # candidate and ask the model "is this really it?" before bothering the user -
  # which catches indexing mistakes (a bottle labelled "mug"), but costs one
  # model call per candidate, 2-5s each on an 8GB Mac.
  #
  # Turn it on with:  python -m src.cli --verify "where is my bottle"
  verify_with_vlm: false
